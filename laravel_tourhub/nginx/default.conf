# =========================================================
# REDIRECT WWW KE NON-WWW
# Contoh:
# https://www.tourhub.my.id/login
# menjadi:
# https://tourhub.my.id/login
# =========================================================
server {
    listen 80;
    server_name www.tourhub.my.id;

    return 301 https://tourhub.my.id$request_uri;
}


# =========================================================
# DOMAIN UTAMA TOURHUB
# =========================================================
server {
    listen 80 default_server;

    server_name tourhub.my.id;

    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 128M;

    error_log  /var/log/nginx/tourhub.error.log;
    access_log /var/log/nginx/tourhub.access.log;

    # Laravel front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Menjalankan PHP melalui container php_skripsi
    location ~ \.php$ {
        try_files $uri =404;

        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php_skripsi:9000;
        fastcgi_index index.php;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;

        # Karena HTTPS ditangani oleh reverse proxy/domain panel
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;

        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_PORT 443;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;

        fastcgi_pass_request_headers on;
    }

    # Menolak akses file tersembunyi seperti .env dan .git
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # File statis tidak perlu memenuhi log
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|css|js|woff|woff2|ttf|eot)$ {
        try_files $uri /index.php?$query_string;

        expires 7d;
        access_log off;
        log_not_found off;
    }
}